[pytest]
markers =
    live: requires network access, real credentials, and/or real provider spend; auto-skipped by chapter_offline_contract_plugin.py's pytest_collection_modifyitems hook (loaded by both tests/chapter_examples/conftest.py and examples/chapter/conftest.py -- round-4 review finding 1) unless `--run-live-chapter` is passed explicitly on the command line -- `-m "not live"` is not required to exclude it, though it works too as a second, independent filter.
    slow: excluded from the default "quick smoke" chapter-examples run (e.g. a test that imports bertopic, which alone can take tens of seconds to several minutes depending on environment); auto-skipped by chapter_offline_contract_plugin.py's pytest_collection_modifyitems hook (same shared plugin as above) unless `--run-slow-chapter` is passed explicitly on the command line.
addopts = --deselect tests/extraction_resolution/test_review_packet.py::test_render_review_packet_against_real_berg2023_fixture --deselect tests/extraction_resolution/test_review_packet.py::test_render_review_packet_against_real_berg2023_fixture_is_json_round_trippable --deselect tests/extraction_resolution/test_review_packet.py::test_render_review_packet_against_real_track3_continuation_six_field_fixture --deselect tests/extraction_resolution/test_review_packet.py::test_render_review_packet_against_real_track3_continuation_six_field_fixture_is_json_round_trippable
